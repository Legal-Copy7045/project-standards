# Reusable: the repository's own privacy guard, loaded from its default branch so a pull request cannot weaken it.
# denylist: true also checks the private terms (PRIVACY_DENYLIST, in the caller's "privacy" environment, main only).
name: Privacy guard
on:
  workflow_call:
    inputs:
      denylist: {type: boolean, default: false}
    secrets:
      PRIVACY_DENYLIST: {required: false}
permissions:
  contents: read
jobs:
  guard:
    if: ${{ !inputs.denylist }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Check for personal details
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git show "origin/${DEFAULT_BRANCH}:.github/scripts/privacy_guard.py" > "$RUNNER_TEMP/privacy_guard.py"
          python3 "$RUNNER_TEMP/privacy_guard.py"
  denylist:
    if: ${{ inputs.denylist }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: privacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Check for personal details and private terms
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          PRIVACY_DENYLIST_REQUIRED: "1"
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git show "origin/${DEFAULT_BRANCH}:.github/scripts/privacy_guard.py" > "$RUNNER_TEMP/privacy_guard.py"
          python3 "$RUNNER_TEMP/privacy_guard.py"

# Reusable: CodeQL, weekly and on demand only. Public repositories upload to the Security tab; private ones (no paid
# code scanning) list the findings in the step summary and keep the SARIF for 30 days.
name: CodeQL
on:
  workflow_call:
    inputs:
      languages: {type: string, required: true, description: 'JSON list, e.g. ["python", "javascript-typescript", "actions"]'}
permissions:
  contents: read
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with: {languages: "${{ matrix.language }}", build-mode: none}
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: codeql-results
      - name: Findings (summary)
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          for f in sorted(pathlib.Path("codeql-results").glob("*.sarif")):
              res = [r for run in json.loads(f.read_text())["runs"] for r in run.get("results", [])]
              print(f"## CodeQL {f.stem}: {len(res)} finding(s)")
              for r in res[:100]:
                  loc = (r.get("locations") or [{}])[0].get("physicalLocation", {})
                  print(f"- {r.get('ruleId')} {loc.get('artifactLocation', {}).get('uri', '?')}:{loc.get('region', {}).get('startLine', '?')}")
          PY
      - if: always() && github.event.repository.private
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: "codeql-${{ matrix.language }}", path: codeql-results/, if-no-files-found: ignore, retention-days: 30}
